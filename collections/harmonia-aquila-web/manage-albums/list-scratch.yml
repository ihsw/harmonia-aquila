info:
  name: list-scratch
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/manage-albums/list?prefix=&useScratchDir=true"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the scratch-only album entry", function () {
          const body = res.getBody();
          const json = typeof body === "string" ? JSON.parse(body) : body;

          expect(res.getStatus()).to.eql(200);
          expect(json).to.be.an("array");
          expect(json).to.include(bru.getEnvVar("scratchAlbumEntry"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
