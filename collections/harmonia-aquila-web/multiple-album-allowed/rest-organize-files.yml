info:
  name: rest-allow-multiple-albums
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/manage-albums/organize-files"
  body:
    type: json
    data: |-
      {
        "allowMultipleAlbums": true,
        "setMetadata": [
          {
            "filename": "track-a.mp3",
            "artist": "Artist A",
            "album": "Album A",
            "trackNumber": 1,
            "title": "Title A"
          },
          {
            "filename": "track-b.mp3",
            "artist": "Artist B",
            "album": "Album B",
            "trackNumber": 1,
            "title": "Title B"
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("REST plans two albums that both start at track 1", function () {
          const body = res.getBody();
          const rows = typeof body === "string" ? JSON.parse(body) : body;

          expect(res.getStatus()).to.eql(201);
          expect(rows).to.have.lengthOf(2);
          expect(rows.map(row => row.destination)).to.eql([
            "Artist A/Album A/01 - Title A.mp3",
            "Artist B/Album B/01 - Title B.mp3"
          ]);
          expect(rows.every(row => row.action === "would copy")).to.eql(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
