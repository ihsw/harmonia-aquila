info:
  name: call-manage-albums-organize-files-scratch-path-traversal
  type: http
  seq: 32

http:
  method: POST
  url: "{{baseUrl}}/mcp"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 108,
        "method": "tools/call",
        "params": {
          "name": "manage_albums_organize_files",
          "arguments": {
            "albumDir": "../outside/",
            "useScratchDir": true
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setHeader("Accept", "application/json, text/event-stream");
        req.setHeader("MCP-Protocol-Version", bru.getEnvVar("mcpProtocolVersion"));
    - type: tests
      code: |-
        test("200 status code", function () {
          expect(res.getStatus()).to.eql(200);
        });

        test("scratch selection enforces the scratch root", function () {
          const body = res.getBody();
          const json = typeof body === "string" ? JSON.parse(body) : body;

          expect(json).to.have.property("id", 108);
          expect(json.result).to.have.property("isError", true);
          expect(json.result.content[0].text).to.include("albumDir");
          expect(json.result.content[0].text).to.include("--scratch-dir");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
